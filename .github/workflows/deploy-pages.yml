name: Deploy WebDGN Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned production build dependencies
        run: |
          python -m pip install --disable-pip-version-check "fonttools==4.60.1"
          npm install --no-audit --no-fund
      - name: Verify renderer and framebuffer tooling
        run: npm test
      - name: Rebuild and verify byte-identical DGN production fonts
        run: npm run build:resources
      - name: Verify generated production resource contract
        run: node ./tests/production-resource.test.mjs
      - name: Export LVGL migration header
        run: npm run export:lvgl
      - name: Verify generated deployment inputs
        run: |
          test -s ui-resource/dgn-production-resources.js
          grep -q '291d4fb201a647f128c02f9e916b057a266e600a' ui-resource/dgn-production-resources.js
          test -s generated/dgn_ui_layout_generated.h
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
